<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>指尖星辰 - 圣诞快乐</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: 'Helvetica Neue', 'PingFang SC', sans-serif; }
        canvas { display: block; }
        
        #instruction {
            position: absolute; top: 60%; width: 100%; text-align: center;
            color: rgba(255,255,255,0.4); font-size: 13px; pointer-events: none;
            transition: opacity 0.5s; z-index: 100; letter-spacing: 2px;
        }

        #heart-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 50px; color: #ff7675; display: none; z-index: 50;
            filter: drop-shadow(0 0 15px #ff7675);
        }

        .heart-filling {
            animation: heartBeat 1.2s infinite, heartGrow 3s forwards linear;
        }

        @keyframes heartBeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        @keyframes heartGrow {
            0% { font-size: 30px; opacity: 0.2; filter: blur(5px); }
            100% { font-size: 75px; opacity: 1; filter: blur(0px); }
        }

        #letter {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 320px; background: rgba(255, 255, 255, 0.94); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 40px 25px; border-radius: 30px; 
            box-shadow: 0 10px 60px rgba(214, 48, 49, 0.6);
            display: none; text-align: center; z-index: 1000;
            opacity: 0; transition: opacity 1s ease-in;
        }
        
        #letter h2 { font-family: 'Dancing Script', cursive; font-size: 32px; margin: 10px 0; background: linear-gradient(45deg, #d63031, #e84393); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #letter p { color: #2d3436; line-height: 2; font-size: 16px; margin: 20px 0; text-align: justify; }
        .tree-icon { font-size: 45px; margin-bottom: 5px; }
        .btn-refresh { margin-top: 15px; border: none; background: #d63031; color: white; padding: 10px 25px; border-radius: 25px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="instruction">长按爱心 3 秒 · 开启圣诞惊喜</div>
    <div id="heart-loader">❤️</div>

    <div id="letter">
        <div class="tree-icon">🎄</div>
        <h2>Dear My Love</h2>
        <p id="typewriter"></p>
        <button class="btn-refresh" onclick="location.reload()">再看一次</button>
    </div>

    <audio id="bgm" src="bgm.mp3" loop></audio>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('instruction');
        const heartLoader = document.getElementById('heart-loader');
        const letter = document.getElementById('letter');
        const typewriter = document.getElementById('typewriter');
        const bgm = document.getElementById('bgm');

        let width, height, particles = [], fireworks = [];
        let pressTimer;
        let audioStarted = false; // 标记音频是否已开始

        const colors = ['#FFD700', '#FFFFFF', '#FF5252', '#FF4081', '#E040FB', '#18FFFF', '#64FFDA'];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        // --- 音乐控制逻辑 ---
        function tryStartAudio() {
            if (!audioStarted) {
                bgm.play().then(() => {
                    audioStarted = true;
                }).catch(err => console.log("等待交互以播放音频"));
            }
        }

        // --- 随机拖尾粒子 ---
        class Particle {
            constructor(x, y) {
                const offset = 15;
                this.x = x + (Math.random() - 0.5) * offset;
                this.y = y + (Math.random() - 0.5) * offset;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 3 + 0.5;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 5; ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // --- 烟花粒子 ---
        class Firework {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.size = Math.random() * 3 + 1.5;
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 10 + 2;
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
                this.life = 1.0;
                this.gravity = 0.12;
            }
            update() {
                this.vx *= 0.96; this.vy *= 0.96;
                this.vy += this.gravity; 
                this.x += this.vx; this.y += this.vy;
                this.life -= 0.012;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function handleMove(e) {
            tryStartAudio(); // 手指滑动时尝试播放音乐
            const t = e.touches ? e.touches[0] : e;
            for(let i=0; i<4; i++) {
                particles.push(new Particle(t.clientX, t.clientY));
            }
            instruction.style.opacity = 0;
        }

        function startPress(e) {
            tryStartAudio(); // 点击时尝试播放音乐
            heartLoader.style.display = 'block';
            heartLoader.className = 'heart-filling';
            pressTimer = setTimeout(showSurprise, 3000); 
        }

        function endPress() {
            clearTimeout(pressTimer);
            if(heartLoader.style.display !== 'none') {
                heartLoader.style.display = 'none';
                heartLoader.className = '';
            }
        }

        function showSurprise() {
            heartLoader.style.display = 'none';
            for(let j=0; j<3; j++) {
                setTimeout(() => {
                    const rx = (width / 2) + (Math.random() - 0.5) * 100;
                    const ry = (height / 2) + (Math.random() - 0.5) * 100;
                    createFireworkExplosion(rx, ry);
                }, j * 200);
            }
            
            setTimeout(() => {
                letter.style.display = 'block';
                setTimeout(() => { letter.style.opacity = 1; }, 100);
                startTypewriter();
            }, 1200);
        }

        function createFireworkExplosion(x, y) {
            for (let i = 0; i < 80; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                fireworks.push(new Firework(x, y, color));
            }
        }

        function startTypewriter() {
            const msg = "这是为你点亮的星辰。希望能用指尖的微光，照亮你整个冬天的温暖。愿你的世界永远纯粹、快乐。圣诞快乐，我的女孩！";
            let i = 0; typewriter.innerHTML = "";
            function type() {
                if (i < msg.length) {
                    typewriter.innerHTML += msg.charAt(i);
                    i++; setTimeout(type, 100);
                }
            }
            type();
        }

        function animate() {
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.fillRect(0, 0, width, height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            fireworks = fireworks.filter(f => f.life > 0);
            fireworks.forEach(f => { f.update(); f.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(e); });
        canvas.addEventListener('touchend', endPress);
        canvas.addEventListener('touchmove', handleMove);
        canvas.addEventListener('mousedown', startPress);
        canvas.addEventListener('mouseup', endPress);
        canvas.addEventListener('mousemove', handleMove);

        init(); animate();
    </script>
</body>
</html>
