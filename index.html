<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>指尖星辰 - 圣诞快乐</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: 'Helvetica Neue', 'PingFang SC', sans-serif; }
        canvas { display: block; }
        
        #instruction {
            position: absolute; top: 50%; width: 100%; text-align: center;
            color: rgba(255,255,255,0.6); font-size: 16px; pointer-events: none;
            z-index: 100; letter-spacing: 2px; transform: translateY(-50%);
        }

        /* 四角星星样式 */
        .corner-star {
            position: absolute; width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; cursor: pointer; z-index: 2000;
            transition: all 0.3s; filter: grayscale(1) opacity(0.5);
        }
        .corner-star.active { filter: grayscale(0) opacity(1); transform: scale(1.5); text-shadow: 0 0 20px #FFD700; }
        
        #star-tl { top: 20px; left: 20px; }
        #star-tr { top: 20px; right: 20px; }
        #star-bl { bottom: 20px; left: 20px; }
        #star-br { bottom: 20px; right: 20px; }

        #letter {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 320px; background: rgba(255, 255, 255, 0.94); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 40px 25px; border-radius: 30px; 
            box-shadow: 0 10px 60px rgba(214, 48, 49, 0.6);
            display: none; text-align: center; z-index: 1000;
            opacity: 0; transition: opacity 1s ease-in;
        }
        
        #letter h2 { font-family: 'Dancing Script', cursive; font-size: 32px; margin: 10px 0; background: linear-gradient(45deg, #d63031, #e84393); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #letter p { color: #2d3436; line-height: 2; font-size: 16px; margin: 20px 0; text-align: justify; }
        .tree-icon { font-size: 45px; margin-bottom: 5px; }
        .btn-refresh { margin-top: 15px; border: none; background: #d63031; color: white; padding: 10px 25px; border-radius: 25px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="instruction">007，圣诞快乐🎉</div>

    <div id="star-tl" class="corner-star" onclick="unlockStar(0, this)">⭐</div>
    <div id="star-tr" class="corner-star" onclick="unlockStar(1, this)">⭐</div>
    <div id="star-bl" class="corner-star" onclick="unlockStar(2, this)">⭐</div>
    <div id="star-br" class="corner-star" onclick="unlockStar(3, this)">⭐</div>

    <div id="letter">
        <div class="tree-icon">🎄</div>
        <h2>Dear My Love</h2>
        <p id="typewriter"></p>
        <button class="btn-refresh" onclick="location.reload()">再看一次</button>
    </div>

    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('instruction');
        const letter = document.getElementById('letter');
        const typewriter = document.getElementById('typewriter');
        const bgm = document.getElementById('bgm');

        let width, height, particles = [], fireworks = [];
        let audioStarted = false;
        let unlockedCount = 0;
        const starsState = [false, false, false, false];

        const colors = ['#FFD700', '#FFFFFF', '#FF5252', '#FF4081', '#E040FB', '#18FFFF', '#64FFDA'];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function tryStartAudio() {
            if (!audioStarted) {
                bgm.play().then(() => {
                    audioStarted = true;
                }).catch(err => console.log("等待交互中..."));
            }
        }

        // 解锁逻辑
        function unlockStar(index, el) {
            tryStartAudio();
            if (starsState[index]) return;

            starsState[index] = true;
            unlockedCount++;
            el.classList.add('active');
            
            // 在星星位置放个小烟花反馈
            const rect = el.getBoundingClientRect();
            createFireworkExplosion(rect.left + 30, rect.top + 30, 30);

            if (unlockedCount === 4) {
                instruction.style.opacity = 0;
                showSurprise();
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 2 + 0.5;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.life = 1.0;
                this.decay = 0.02;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        class Firework {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.size = Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 8 + 2;
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
                this.life = 1.0;
                this.gravity = 0.15;
            }
            update() {
                this.vx *= 0.95; this.vy *= 0.95;
                this.vy += this.gravity; 
                this.x += this.vx; this.y += this.vy;
                this.life -= 0.015;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function handleMove(e) {
            tryStartAudio();
            const t = e.touches ? e.touches[0] : e;
            for(let i=0; i<2; i++) {
                particles.push(new Particle(t.clientX, t.clientY));
            }
        }

        function showSurprise() {
            // 隐藏所有星星
            document.querySelectorAll('.corner-star').forEach(s => s.style.display = 'none');
            
            // 连环烟花
            for(let j=0; j<5; j++) {
                setTimeout(() => {
                    createFireworkExplosion(width/2 + (Math.random()-0.5)*200, height/2 + (Math.random()-0.5)*200, 60);
                }, j * 300);
            }
            
            setTimeout(() => {
                letter.style.display = 'block';
                setTimeout(() => { letter.style.opacity = 1; }, 100);
                startTypewriter();
            }, 1500);
        }

        function createFireworkExplosion(x, y, count) {
            for (let i = 0; i < count; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                fireworks.push(new Firework(x, y, color));
            }
        }

        function startTypewriter() {
            const msg = "这是为你点亮的星辰。希望能用四角的微光，汇聚成照亮你整个冬天的温暖。愿你的世界永远纯粹、快乐。圣诞快乐！";
            let i = 0; typewriter.innerHTML = "";
            function type() {
                if (i < msg.length) {
                    typewriter.innerHTML += msg.charAt(i);
                    i++; setTimeout(type, 100);
                }
            }
            type();
        }

        function animate() {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0, 0, width, height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            fireworks = fireworks.filter(f => f.life > 0);
            fireworks.forEach(f => { f.update(); f.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        // 全局触摸/点击支持
        window.addEventListener('touchstart', tryStartAudio);
        window.addEventListener('mousedown', tryStartAudio);
        canvas.addEventListener('touchmove', handleMove);
        canvas.addEventListener('mousemove', handleMove);

        init(); animate();
    </script>
</body>
</html>
